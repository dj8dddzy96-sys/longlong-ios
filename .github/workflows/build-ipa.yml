name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project PocketStash.xcodeproj \
            -scheme PocketStash \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry PocketStash-unsigned.ipa Payload
          unzip -l PocketStash-unsigned.ipa | head -20
          ls -lh PocketStash-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketStash-unsigned-ipa
          path: out/PocketStash-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      # 公开仓库时，这一步会给出可直接在手机侧安装的直链：
      # https://github.com/<你>/<仓库>/releases/download/build-<N>/PocketStash-unsigned.ipa
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 龙龙 iOS build ${{ github.run_number }}
          body: |
            未签名 IPA，供 SideStore / Sideloadly / TrollStore 使用。
            构建时间：${{ github.event.repository.updated_at }}
          files: out/PocketStash-unsigned.ipa
          draft: false
          prerelease: true
