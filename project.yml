name: PocketStash
options:
  bundleIdPrefix: com.yg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  PocketStash:
    type: application
    platform: iOS
    sources:
      - path: PocketStash
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yg.pocketstash
        INFOPLIST_FILE: PocketStash/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
